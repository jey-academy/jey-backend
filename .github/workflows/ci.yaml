name: CI

on:
  pull_request:
  push:
    branches: [main]
    # 릴리스 태그(v1.0.1 등)를 push하면 그 커밋을 배포한다. main에 머지하는 것만으로는 배포하지 않는다(ADR-0039).
    tags: ['v*']
  # 같은 태그를 다시 배포할 때 쓴다(실패한 배포 다시 돌리기, 이전 태그로 되돌리기): --ref <태그>.
  workflow_dispatch:

# 같은 PR에 새 커밋이 오면 이전 실행을 취소한다. main은 취소하지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # 컴파일, 단위·통합 테스트(Testcontainers: MySQL, Redis), ModularityTest까지 포함한다.
      - name: Build
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      # 배포 잡이 이미지에 넣는다. 테스트를 지난 바로 그 jar다.
      - name: Upload app jar
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 1

  # 서버 쪽 파일의 검사: 배포 스크립트(shellcheck, 실패 경로 시험), CloudFront Function(시험 이벤트).
  # Nginx 설정은 build의 NginxConfigTest가 실제 nginx로 본다.
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 /mnt/infra/app/bin/deploy.sh /mnt/infra/app/test/deploy.bats /mnt/infra/nat/user-data.sh

      - name: Deploy script tests
        run: docker run --rm -v "$PWD:/repo" -w /repo bats/bats:1.11.0 infra/app/test

      - name: CloudFront Function tests
        run: node infra/cloudfront/run-tests.mjs

  # 릴리스 태그를 붙이면 이미지를 ECR에 올리고, 앱 서버에서 blue/green으로 바꿔 끼운다 (ADR-0039).
  # AWS 인증은 OIDC(장기 키 없음). 역할은 환경 production에서만 맡을 수 있고, 바꿀 수 있는 것은
  # 이 저장소의 이미지를 올리는 것과 배포 문서(태그 하나만 받는다)를 앱 서버에 보내는 것뿐이다(그 밖에는 결과 읽기와 자기 명령 취소).
  deploy:
    name: deploy
    needs: [build, infra]
    # 릴리스 태그(v*)에서만 돈다. 환경 production도 v* 태그만 허용한다(둘 중 하나가 풀려도 다른 쪽이 막는다).
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # 서버가 Graviton(arm64)이다. 이미지는 어느 PC에서든 만들 수 있지만(Dockerfile), 검사하는 이미지가
    # 서버에서 돌 바로 그 arm64 이미지가 되도록 arm 러너에서 만든다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: production
    # 배포는 하나씩. 앞의 배포를 취소하지 않는다(서버 스크립트도 동시 실행을 막는다).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: jey-app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 아래의 조상 확인에 이력이 필요하다.
          fetch-depth: 0

      # 태그는 아무 커밋에나 붙일 수 있다. 리뷰를 거쳐 main에 들어간 커밋만 배포한다.
      - name: Require tagged commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그가 main에 없는 커밋을 가리킨다. main에 머지한 커밋에만 릴리스 태그를 붙인다."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: build/libs

      - name: Build image
        run: docker build --platform linux/arm64 -t "$IMAGE" .

      # 고칠 수 있는 치명적 취약점이 있으면 AWS에 닿기 전에 멈춘다. 태그 대신 커밋으로 고정한다.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # 이 잡은 OIDC 토큰을 받는다. 토큰을 다루는 액션은 태그 대신 커밋으로 고정한다(태그는 옮길 수 있다).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # 태그는 덮어쓸 수 없다(ECR IMMUTABLE). 같은 커밋을 다시 배포할 때는 이미 올린 이미지를 그대로 쓴다.
      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          found=$(aws ecr batch-get-image --repository-name "$REPOSITORY" --image-ids imageTag="$GITHUB_SHA" \
            --query 'length(images)' --output text)
          if [ "$found" != 0 ]; then
            echo "이 커밋의 이미지가 이미 있다. 올리지 않고 그 이미지로 배포한다."
            exit 0
          fi
          docker tag "$IMAGE" "$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$REPOSITORY:$GITHUB_SHA"

      # 서버의 배포 스크립트가 끝날 때까지 기다리고, 그 출력을 그대로 보여 준다(앱 로그는 싣지 않는다 — 서버 파일).
      # 전달 제한 120초: 서버가 그 안에 명령을 받지 못하면 실행하지 않는다(늦게 받은 옛 배포가 나중에 도는 일을 막는다).
      # 기다림(12분 30초)은 전달 제한 + 문서의 실행 제한(600초)보다 길다.
      - name: Deploy on app server
        env:
          INSTANCE_ID: ${{ vars.APP_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command --document-name jey-prod-deploy --instance-ids "$INSTANCE_ID" \
            --parameters "ImageTag=$GITHUB_SHA" --comment "deploy $GITHUB_SHA" --timeout-seconds 120 \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          status=Pending
          for _ in $(seq 1 150); do
            sleep 5
            # 보낸 직후에는 아직 기록이 없다(InvocationDoesNotExist). 그 밖의 오류(권한, 잘못된 인스턴스 등)는 바로 멈춘다.
            if ! status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>"$RUNNER_TEMP/ssm.err"); then
              if grep -q InvocationDoesNotExist "$RUNNER_TEMP/ssm.err"; then
                status=Pending
              else
                echo "::error::배포 결과를 읽지 못했다: $(cat "$RUNNER_TEMP/ssm.err")"
                exit 1
              fi
            fi
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done
          for stream in StandardOutputContent StandardErrorContent; do
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query "$stream" --output text || true
          done
          case "$status" in
            Success) ;;
            Pending|InProgress|Delayed)
              aws ssm cancel-command --command-id "$command_id" || true
              echo "::error::기다리는 동안 끝나지 않아 명령을 취소했다(SSM 상태: $status). 서버에서 이미 돌고 있었다면 끝까지 갈 수 있다 — 서버의 active.conf와 슬롯을 직접 본다."
              exit 1 ;;
            *)
              echo "::error::배포가 성공하지 못했다(SSM 상태: $status). 위 출력의 마지막 줄을 본다: kept = 그 슬롯이 그대로 요청을 받는다, failed = 서버를 직접 본다."
              exit 1 ;;
          esac
