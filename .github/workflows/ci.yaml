name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 머지 전에 브랜치에서 배포를 시험할 때만 쓴다. 배포 잡은 환경 production의 배포 브랜치 규칙을 따른다.
  workflow_dispatch:

# 같은 PR에 새 커밋이 오면 이전 실행을 취소한다. main은 취소하지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # 컴파일, 단위·통합 테스트(Testcontainers: MySQL, Redis), ModularityTest까지 포함한다.
      - name: Build
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      # 배포 잡이 이미지에 넣는다. 테스트를 지난 바로 그 jar다.
      - name: Upload app jar
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 1

  # main에 머지하면 이미지를 ECR에 올리고, 앱 서버에서 blue/green으로 바꿔 끼운다 (ADR-0039).
  # AWS 인증은 OIDC(장기 키 없음). 역할은 환경 production에서만 맡을 수 있고, 할 수 있는 일은
  # 이 이미지를 올리는 것과 배포 문서(태그 하나만 받는다)를 앱 서버에 보내는 것뿐이다.
  deploy:
    name: deploy
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    # 서버가 Graviton이라 arm 러너에서 에뮬레이션 없이 만든다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: production
    # 배포는 하나씩. 앞의 배포를 취소하지 않는다(서버 스크립트도 동시 실행을 막는다).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: jey-app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: build/libs

      - name: Build image
        run: docker build --platform linux/arm64 -t "$IMAGE" .

      # 고칠 수 있는 치명적 취약점이 있으면 AWS에 닿기 전에 멈춘다. 태그 대신 커밋으로 고정한다.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # 이 잡은 OIDC 토큰을 받는다. 토큰을 다루는 액션은 태그 대신 커밋으로 고정한다(태그는 옮길 수 있다).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # 태그는 덮어쓸 수 없다(ECR IMMUTABLE). 같은 커밋을 다시 배포할 때는 이미 올린 이미지를 그대로 쓴다.
      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          found=$(aws ecr batch-get-image --repository-name "$REPOSITORY" --image-ids imageTag="$GITHUB_SHA" \
            --query 'length(images)' --output text)
          if [ "$found" != 0 ]; then
            echo "이 커밋의 이미지가 이미 있다. 올리지 않고 그 이미지로 배포한다."
            exit 0
          fi
          docker tag "$IMAGE" "$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$REPOSITORY:$GITHUB_SHA"

      # 서버의 배포 스크립트가 끝날 때까지(최대 10분) 기다리고, 그 출력을 그대로 보여 준다.
      - name: Deploy on app server
        env:
          INSTANCE_ID: ${{ vars.APP_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command --document-name jey-prod-deploy --instance-ids "$INSTANCE_ID" \
            --parameters "ImageTag=$GITHUB_SHA" --comment "deploy $GITHUB_SHA" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done
          for stream in StandardOutputContent StandardErrorContent; do
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query "$stream" --output text || true
          done
          if [ "$status" != Success ]; then
            echo "::error::배포가 끝나지 않았다(SSM 상태: $status). 서버는 이전 슬롯 그대로다."
            exit 1
          fi
