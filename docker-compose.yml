# 로컬 개발용. 이미지 버전은 TestcontainersConfiguration과 맞춘다.
# 호스트 포트는 PC의 다른 MySQL(3306)·Redis(6379)와 겹치지 않게 3307, 6380을 쓴다.
services:
  mysql:
    image: mysql:8.4
    container_name: jey-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jey
      MYSQL_USER: jey
      MYSQL_PASSWORD: jey
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ujey", "-pjey"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    container_name: jey-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
