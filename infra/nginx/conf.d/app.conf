# 앱 서버 앞단. TLS는 CloudFront가 하고, 여기는 VPC 안에서 80만 듣는다.
# 지금 슬롯(blue/green)은 배포 스크립트가 /etc/nginx/upstream/active.conf에 쓰고 reload한다.

# CloudFront는 X-Forwarded-Proto를 보내지 않는다. 원본 요청 정책으로 받은 CloudFront-Forwarded-Proto를 옮긴다.
# https가 아닌 값은 모두 http로 본다(앱이 쿠키·리다이렉트를 원래 프로토콜로 만든다).
map $http_cloudfront_forwarded_proto $forwarded_proto {
	https   https;
	default http;
}

upstream app {
	include /etc/nginx/upstream/active.conf;
	keepalive 16;
}

server {
	listen 80 default_server;
	server_tokens off;
	client_max_body_size 1m;

	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $forwarded_proto;
	# CloudFront가 붙인 클라이언트 IP 뒤에 이 요청을 보낸 주소(VPC 오리진)를 붙인다.
	# 앱은 VPC·Docker 브리지·루프백 주소를 건너뛴 첫 주소를 클라이언트로 본다.
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

	# Nginx 혼자 답한다(앱과 무관하게 앞단이 살아 있는지).
	location = /api/ping {
		default_type text/plain;
		return 200 "ok\n";
	}

	# 앱의 readiness. 상태만 답한다. 배포 확인과 바깥 감시가 쓴다.
	location = /api/health {
		proxy_pass http://app/actuator/health/readiness;
	}

	location /api/ {
		proxy_pass http://app;
	}

	# /actuator 등 나머지는 바깥에 내지 않는다.
	location / {
		return 404;
	}
}
