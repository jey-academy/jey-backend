# 앱 서버 앞단. TLS는 CloudFront가 하고, 여기는 VPC 안에서 80만 듣는다.
# 지금 슬롯(blue/green)은 배포 스크립트가 /etc/nginx/upstream/active.conf에 쓰고 reload한다.

# CloudFront는 X-Forwarded-Proto를 보내지 않는다. 원본 요청 정책으로 받은 CloudFront-Forwarded-Proto를 옮긴다.
# https가 아닌 값은 모두 http로 본다(앱이 쿠키·리다이렉트를 원래 프로토콜로 만든다).
map $http_cloudfront_forwarded_proto $forwarded_proto {
	https   https;
	default http;
}

# 클라이언트 IP는 CloudFront가 직접 정하는 CloudFront-Viewer-Address("IP:포트", IPv6도 대괄호 없이 끝에 :포트)에서 읽는다.
# X-Forwarded-For는 쓰지 않는다: 요청자가 적은 값 뒤에 CloudFront 서버 주소가 붙어 와서, 앱이 CloudFront 주소를 클라이언트로 보게 된다.
# 이 헤더가 없으면(CloudFront를 거치지 않은 요청: 배포 스크립트의 확인 등) X-Forwarded-For를 보내지 않는다 — 앱은 접속 주소를 쓴다.
map $http_cloudfront_viewer_address $viewer_ip {
	"~^(?<ip>.+):[0-9]+$" $ip;
	default "";
}

upstream app {
	include /etc/nginx/upstream/active.conf;
	keepalive 16;
}

server {
	listen 80 default_server;
	server_tokens off;
	client_max_body_size 1m;

	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $forwarded_proto;
	# 값이 하나뿐이고, 앱은 이 요청을 보낸 Nginx(Docker 브리지 주소)를 믿으므로 이 값을 클라이언트로 본다.
	proxy_set_header X-Forwarded-For $viewer_ip;

	# Nginx 혼자 답한다(앱과 무관하게 앞단이 살아 있는지).
	location = /api/ping {
		default_type text/plain;
		return 200 "ok\n";
	}

	# 앱의 readiness. 상태만 답한다. 배포 확인과 바깥 감시가 쓴다.
	location = /api/health {
		proxy_pass http://app/actuator/health/readiness;
	}

	location /api/ {
		proxy_pass http://app;
	}

	# /actuator 등 나머지는 바깥에 내지 않는다.
	location / {
		return 404;
	}
}
