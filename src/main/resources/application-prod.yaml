# 비밀값은 환경변수로만 받는다. 값을 이 파일에 쓰지 않는다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # ElastiCache는 전송 암호화를 켜 두어 TLS가 아니면 연결을 받지 않는다.
      ssl:
        enabled: true
  session:
    data:
      redis:
        # ElastiCache는 CONFIG 명령을 막아, 앱이 키 만료 알림을 직접 켜려 하면 서버가 뜨지 않는다.
        # 색인 세션은 만료 알림으로 계정별 색인을 치우므로 알림은 ElastiCache 파라미터 그룹에서 켠다(notify-keyspace-events = Egx).
        configure-action: none

# CloudFront가 HTTPS를 받고 Nginx가 넘기므로, 원래 요청의 프로토콜과 클라이언트 IP를 전달 헤더에서 읽는다.
# 프로토콜은 Nginx가 CloudFront-Forwarded-Proto를 X-Forwarded-Proto로 옮겨 싣는다.
# 클라이언트 IP는 Nginx가 CloudFront-Viewer-Address에서 뗀 IP 하나를 X-Forwarded-For로 싣는다(요청이 보낸 값은 버린다).
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # 프록시로 믿는 주소: Docker 브리지(앱에 접속하는 Nginx 컨테이너)와 루프백. VPC 대역은 Nginx를 거치지 않고
      # VPC 안에서 앱에 닿는 경로를 위한 것이다(지금은 없다). 이 주소에서 온 요청만 X-Forwarded-For를 믿는다.
      # 로그인 시도 한도와 패스 다시 연결이 그 IP로 센다. Nginx를 못 믿으면 모든 요청이 Nginx 주소 하나로 보이고,
      # 대역을 넓히면 바깥 주소에서 온 요청이 적은 X-Forwarded-For까지 믿게 된다.
      internal-proxies: '10\.0\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|127\.0\.0\.1'

jey:
  auth:
    # 프론트 주소. 없거나, 비어 있거나, 형식이 틀리면 서버가 뜨지 않는다.
    allowed-origins: ${AUTH_ALLOWED_ORIGINS}
    allowed-origins-required: true
    # 프론트와 API의 호스트가 다르면 공통 상위 도메인을 넣는다.
    # 호스트가 다른데 비워 두면 프론트가 CSRF 쿠키를 읽지 못해 변경 요청이 모두 403이 된다.
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
    # 기본값과 같지만 운영에서 꺼지지 않게 명시한다.
    secure-cookies: true
    login-attempt-limit:
      # 32자 이상의 무작위 값. 없으면 서버가 뜨지 않는다.
      hmac-key: ${AUTH_LOGIN_ATTEMPT_HMAC_KEY}
    initial-admin:
      login-id: ${INITIAL_ADMIN_LOGIN_ID:}
      password: ${INITIAL_ADMIN_PASSWORD:}
      name: ${INITIAL_ADMIN_NAME:관리자}
      # 계정이 하나도 없는데 위 값이 없으면 서버가 뜨지 않는다.
      required: true
  # 전화번호 암호화 키(ADR-0009). 없거나 형식이 틀리면 서버가 뜨지 않는다.
  crypto:
    phone:
      # 새로 저장할 때 쓰는 암호화 키의 버전. 키를 교체할 때는 아래에 새 버전을 추가한 뒤 이 값을 올린다.
      active-key-version: ${PHONE_ENCRYPTION_ACTIVE_KEY_VERSION:1}
      # Base64로 적은 32바이트 무작위 값. 옛 버전은 그 버전으로 저장된 값이 남아 있는 동안 지우지 않는다.
      encryption-keys:
        1: ${PHONE_ENCRYPTION_KEY_1}
      # Base64로 적은 32바이트 이상의 무작위 값. 암호화 키와 다른 값이어야 한다.
      # 바꾸면 저장된 인덱스와 맞지 않아 전화번호 검색이 되지 않는다.
      hmac-key: ${PHONE_HMAC_KEY}
  # 동탄고 패스 QR 토큰의 서명 키(ADR-0010). 없거나 형식이 틀리면 서버가 뜨지 않는다.
  dongtanpass:
    qr:
      # 새 토큰을 서명하는 키의 버전. 키를 바꾸는 순서(배포가 두 번 필요하다):
      #   1) keys에 "2: ${QR_SIGNING_KEY_2}" 줄을 더하고 QR_SIGNING_KEY_2를 설정해 배포한다(아직 버전 1로 서명한다)
      #   2) QR_SIGNING_ACTIVE_KEY_VERSION=2로 바꿔 다시 시작한다(새 토큰은 버전 2, 옛 토큰도 1분간 확인된다)
      #   3) 1분 뒤 "1:" 줄을 지워 배포하고 QR_SIGNING_KEY_1을 없앤다
      # 2) 전에 버전 2의 키가 없으면 서버가 뜨지 않는다.
      active-key-version: ${QR_SIGNING_ACTIVE_KEY_VERSION:1}
      # Base64로 적은 32바이트 이상의 무작위 값. 전화번호 키와 다른 값이어야 한다.
      keys:
        1: ${QR_SIGNING_KEY_1}

# 로그를 JSON 한 줄로 내보낸다 (ADR-0028). 요청 ID와 계정 ID는 최상위 필드(requestId, accountId)로 나온다.
# 로그를 모으는 도구가 줄 단위로 읽고 요청 ID로 찾을 수 있게 하기 위해서다. 오류의 스택도 한 줄 안에 들어간다.
logging:
  structured:
    format:
      console: logstash

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
