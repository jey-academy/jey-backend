spring:
  application:
    name: jey-backend
  web:
    # 에러 응답 문구(검증 메시지 포함)를 Accept-Language와 무관하게 한국어로 고정한다 (ADR-0014).
    locale: ko_KR
    locale-resolver: fixed
  data:
    redis:
      # Redis가 응답하지 않을 때 요청이 오래 매달리지 않게 한다. 설정하지 않으면 명령 하나가 60초까지 기다린다.
      timeout: 2s
      connect-timeout: 2s
  session:
    data:
      redis:
        # 계정 ID로 그 계정의 세션을 찾을 수 있게 색인을 둔다. 계정을 차단할 때 세션을 끊는 데 쓴다.
        repository-type: indexed
  modulith:
    events:
      # 서버가 내려갔다 올라올 때 처리되지 않은 채 남아 있던 이벤트를 다시 보낸다 (ADR-0025).
      republish-outstanding-events-on-restart: true
      staleness:
        # 다시 보낼 때 발행 기록에 "다시 보내는 중" 표시가 먼저 붙고, 그 표시가 붙은 것은 다시 보내지 않는다.
        # 표시가 붙은 뒤 리스너가 시작하기 전에 서버가 내려가면 표시가 그대로 남는다.
        # 발행된 지 이 시간이 지나도록 남아 있는 표시를 실패로 되돌려서 다음 주기에 다시 보내지게 한다. 기본값은 꺼짐이다.
        resubmitted: 10m
        # 아래 둘도 같이 적는다. 셋 중 하나만 적으면 감시가 켜지면서 적지 않은 상태는 0초로 읽혀,
        # 방금 발행됐거나 처리 중인 이벤트까지 매분 실패로 표시된다(다시 보내는 데는 지장이 없지만 상태가 뜻을 잃는다).
        published: 10m
        processing: 10m
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # DB를 직접 열어 봤을 때 한국 시각으로 읽히게 저장한다 (ADR-0017).
        # Hibernate는 기본적으로 Instant를 UTC로 저장하고 jdbc.time_zone을 적용하지 않는다.
        # TIMESTAMP 방식으로 바꿔야 아래 시간대가 Instant에도 적용된다.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: Asia/Seoul

jey:
  auth:
    # 세션 만료 시간(마지막 요청 기준). 데스크 직원은 화면을 하루 종일 켜 두고,
    # 권한이 큰 관리자와 외부에서 접속하는 연계 학원은 짧게 둔다.
    session-timeout:
      admin: 2h
      staff: 12h
      partner: 2h
    # 세션 최대 유지 시간(로그인 시점 기준). 계속 쓰고 있어도 이 시간이 지나면 다시 로그인해야 한다.
    # 화면이 주기적으로 요청을 보내면 위 만료 시간만으로는 세션이 끝나지 않기 때문에 둔다.
    session-max-lifetime:
      admin: 12h
      staff: 16h
      partner: 12h
    # 로그인 시도 제한 (ADR-0020). window 동안의 실패를 세고, 한도를 넘으면 429로 응답한다.
    login-attempt-limit:
      window: 15m
      # 한 IP에서 한 아이디로 실패할 수 있는 횟수
      max-failures-per-login-id-and-ip: 5
      # 한 IP에서 아이디와 무관하게 실패할 수 있는 횟수. 같은 공유기를 쓰는 사람끼리 나눠 쓴다.
      max-failures-per-ip: 30
      # hmac-key(아이디를 Redis 키에 넣을 때 쓰는 비밀키)는 기본값이 없다. 프로필마다 넣어야 하고, 없으면 서버가 뜨지 않는다.
    # 본인 비밀번호 변경 (ADR-0030). 계정마다 window 동안 "지금 비밀번호"를 max-failures번까지 틀릴 수 있다. 넘으면 429로 응답한다.
    password-change-limit:
      window: 15m
      max-failures: 5

  web:
    # 부작용 있는 POST는 Idempotency-Key로 한 번만 실행한다 (ADR-0027).
    idempotency:
      # 끝난 요청의 응답을 보관하는 기간. 이 동안 같은 키의 요청은 다시 실행되지 않고 보관한 응답을 받는다.
      retention: 24h
      # 처리 중이라고 표시해 두는 기간. 처리하던 서버가 죽으면 이 시간 뒤에 같은 키로 다시 실행할 수 있다.
      processing-lease: 2m

  member:
    # 전체 전화번호 보기 (ADR-0026). 계정마다 window 동안 max번까지 본다. 넘으면 429로 응답한다.
    phone-reveal-limit:
      window: 1h
      max: 60
    # 전화번호가 실린 변경 요청(학생 등록, 학부모 추가, 번호를 실은 학부모 수정). 성공한 것도 센다.
    # 번호를 바꿔 가며 넣는 대입에서 틀린 번호는 거부가 아니라 성공으로 끝나기 때문이다. 넘으면 그 요청들이 429로 막힌다.
    phone-change-limit:
      window: 1h
      max: 100
    # "그 번호가 이미 있다"가 드러나는 거부 응답(번호 중복, 이미 연결됨, 같은 이름의 학생).
    # 계정마다 window 동안 max번 받으면 번호가 실린 변경 요청이 429로 막힌다.
    phone-probe-limit:
      window: 15m
      max: 10

  dongtanpass:
    # 학부모 링크 다시 받기의 틀린 시도 (ADR-0035). 이름과 번호가 맞은 요청은 세지 않는다. 넘으면 구간이 끝날 때까지 429로 응답한다.
    # 테스트도 이 값을 그대로 쓴다(테스트마다 다른 접속 주소를 쓰고 횟수 키를 비운다).
    holder-relink:
      window: 5m
      # 한 접속 주소에서 한 번호로
      max-failures-per-phone-and-client: 10
      # 한 접속 주소에서 번호와 무관하게. 학원 와이파이처럼 여러 사람이 주소 하나를 함께 쓰므로 넉넉하게 둔다
      max-failures-per-client: 60
    # 데스크의 패스 번호 확인. 계정마다 맞든 틀리든 센다(번호는 짧아 넣어 보며 찾을 수 있다). QR 확인은 세지 않는다.
    # 테스트도 이 값을 그대로 쓴다(한도를 세는 테스트는 테스트마다 새 계정 ID를 쓴다).
    pass-no-verify:
      window: 1h
      max: 60
    # 데스크의 본인 미리 확인(ADR-0033). 계정마다 맞든 틀리든 센다(번호를 넣어 보며 패스 주인을 알아낼 수 있다).
    # 요청 하나에 번호를 4개까지 보내므로 한 계정이 넣어 볼 수 있는 번호는 구간마다 최대 max × 4개다(1시간 120개).
    # 테스트도 이 값을 그대로 쓴다(한도를 세는 테스트는 테스트마다 새 계정 ID를 쓴다).
    holder-check:
      window: 1h
      max: 30
    # 패스 사용 처리 (ADR-0033). 학생 자료를 만든 뒤 이 기간이 지나기 전까지만 신규 학생으로 보고 패스를 쓸 수 있다.
    # 다음 날 다시 시도하는 경우를 위한 여유다. 테스트도 이 값을 그대로 쓴다.
    redeem:
      new-student-window: 7d
    # 데스크의 패스 사용 처리. 계정마다 맞든 틀리든 센다(이름·번호 대조 결과로 패스 ID를 바꿔 가며 패스 주인을 훑지 못하게).
    # 데스크의 사용 처리는 하루 몇 건이다. 테스트도 이 값을 그대로 쓴다(한도를 세는 테스트는 테스트마다 새 계정 ID를 쓴다).
    redeem-limit:
      window: 1h
      max: 30

  events:
    # 처리에 실패한 이벤트를 주기적으로 다시 보낸다 (ADR-0025).
    resubmission:
      # 확인하는 간격
      interval: 1m
      # 발행된 지 이 시간이 지나도록 끝나지 않은 것만 다시 보낸다. 방금 발행돼 처리 중인 것은 건드리지 않는다.
      older-than: 5m

logging:
  pattern:
    # 로그 줄마다 [요청 ID|계정 ID]를 찍는다 (ADR-0028). 요청 밖에서 남긴 줄(기동, 주기 작업)은 비어 있다.
    # 운영은 JSON으로 내보내므로 이 형식을 쓰지 않는다(application-prod.yaml).
    correlation: "[%X{requestId:-}|%X{accountId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
