# DB·Redis 접속 정보는 TestcontainersConfiguration의 @ServiceConnection이 넣는다.
logging:
  level:
    org.testcontainers: warn
    tc: warn

jey:
  auth:
    allowed-origins: http://localhost:5173
    secure-cookies: false
    login-attempt-limit:
      hmac-key: test-only-login-attempt-hmac-key-0123456789
  crypto:
    phone:
      active-key-version: 1
      encryption-keys:
        1: dGVzdC1vbmx5LXBob25lLWVuYy1rZXktMDAwMDAwMDE=
      hmac-key: dGVzdC1vbmx5LXBob25lLWhtYWMta2V5LTAwMDAwMDE=
  dongtanpass:
    qr:
      active-key-version: 1
      keys:
        1: dGVzdC1vbmx5LWRvbmd0YW5wYXNzLXFyLWtleS0wMDE=
  billing:
    ledger:
      # 장부 반영의 다시 시도 스케줄러는 테스트에서 돌지 않게 한다. 테스트 컨텍스트들이 DB 하나를 같이 쓰므로,
      # 장부가 꺼진 컨텍스트의 스케줄러가 다른 테스트의 줄을 집어 NOT_CONFIGURED로 끝내 버린다. 필요한 테스트가 직접 부른다.
      retry-interval: 1h
  member:
    # 테스트는 한 계정으로 거부되는 요청을 되풀이하고 Redis의 횟수는 테스트 사이에 남는다.
    # 한도를 그대로 두면 순서에 따라 엉뚱한 테스트가 429를 받는다. 한도를 보는 테스트는 값을 직접 정한다.
    phone-probe-limit:
      max: 100000
    # 등록을 되풀이하는 테스트가 많다. 같은 이유로 크게 잡는다.
    phone-change-limit:
      max: 100000
